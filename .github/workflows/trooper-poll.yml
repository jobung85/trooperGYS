name: trooper-poll

# Polls Notion every 6h and sends WhatsApp DMs for new tasks.
# Free alternative to Render's (no longer free) Cron Job tier.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC = 07:00, 13:00, 19:00, 01:00 Asia/Jakarta
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run poller
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAIN_TASK_DB: 36fe9c57-814d-80c8-8ea0-cb45f5ee2eb2
          NOTION_TASK_TRACKER_DB: 36fe9c57-814d-80d9-8704-f26fec4bf51d
          WHATSAPP_PHONE_NUMBER_ID: "1059304737269663"
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          TIMEZONE: Asia/Jakarta
          STATE_FILE: .state/last_poll.json
        run: python -m scripts.poll_once

      - name: Persist seen-task cursor (artifact, optional)
        uses: actions/upload-artifact@v4
        with:
          name: trooper-poll-state-${{ github.run_id }}
          path: .state/
          retention-days: 30
          if-no-files-found: ignore
